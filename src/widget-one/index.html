<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grist Widget</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

      :root {
        --color-primary: #166534; /* Green-800 */
        --color-text: #374151;    /* Gray-700 */
        --color-subtle: #9ca3af;  /* Gray-400 */
        --color-bg: #f9fafb;      /* Gray-50 */
        --color-border: #e5e7eb; /* Gray-200 */
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--color-bg);
        color: var(--color-text);
        margin: 0;
        padding: 1.25rem;
        font-size: 14px;
        line-height: 1.5;
      }

      #app {
        max-width: 42rem;
        margin: 0 auto;
        text-align: center;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--color-primary);
      }

      p {
        margin-top: 0.5rem;
        color: var(--color-subtle);
      }

      #status-container {
        margin-top: 2rem;
        padding: 1rem;
        border-radius: 0.5rem;
        background-color: #fff;
        border: 1px solid var(--color-border);
        box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        min-height: 40px;
        transition: all 0.2s ease-in-out;
      }
      #status-container.success {
        color: var(--color-primary);
        background-color: #f0fdf4; /* Green-50 */
        border-color: #bbf7d0; /* Green-200 */
      }

      .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid var(--color-primary);
        border-bottom-color: transparent;
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 1s linear infinite;
      }

      @keyframes rotation {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>Calculateur de présences</h1>
      <p>Mettre à jour les dates d’arrivée ou de départ d’une personne déclenchera le recalcul des présences aux différents repas dans la table Présences.</p>
      <div id="status-container">
        <span id="status-message">Prêt.</span>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
