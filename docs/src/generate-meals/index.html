<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Générateur de Repas</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script type="module" crossorigin src="https://vincentvillet.github.io/custom-grist-widgets/assets/generate-meals-53nFei0C.js"></script>
    <link rel="modulepreload" crossorigin href="https://vincentvillet.github.io/custom-grist-widgets/assets/style-CIufQ7o1.js">
    <link rel="modulepreload" crossorigin href="https://vincentvillet.github.io/custom-grist-widgets/assets/grist-data-helpers-BrE7uIyY.js">
    <link rel="modulepreload" crossorigin href="https://vincentvillet.github.io/custom-grist-widgets/assets/constants-DOByq0uJ.js">
    <link rel="stylesheet" crossorigin href="https://vincentvillet.github.io/custom-grist-widgets/assets/style-BLn2_qsq.css">
  </head>
  <body>
    <div id="app">
      <h1>Générateur de Repas</h1>
      <p>Sélectionnez une période et cliquez sur "Générer" pour remplir la table "Repas".</p>
      
      <div class="form-container">
        <div class="form-group">
          <label for="start-date">Date de début</label>
          <input type="date" id="start-date">
        </div>
        <div class="form-group">
          <label for="end-date">Date de fin</label>
          <input type="date" id="end-date">
        </div>
        <button id="generate-btn">Générer les repas</button>
      </div>

      <div id="status-container">
        <span id="status-message">Prêt.</span>
      </div>
    </div>
  </body>
</html>
